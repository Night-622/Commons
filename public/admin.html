<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commons admin</title><meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { overflow: auto; } .adm { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
    .adm h1 { margin: 0 0 4px; } .adm .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
    .item { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; background: var(--panel, #fff); }
    .item.done { opacity: .55; } .item pre { white-space: pre-wrap; font: inherit; margin: 6px 0; }
    .meta { color: var(--soft); font-size: .85em; } .item .row { margin: 6px 0 0; }
  </style>
</head>
<body>
  <main class="adm">
    <h1>Commons admin</h1>
    <p class="soft" id="who">Checking your access…</p>
    <div class="row">
      <button class="btn primary" id="signin" type="button">Sign in with Google</button>
      <div class="seg" role="tablist" id="tabs">
        <button type="button" role="tab" data-tab="feedback" aria-selected="true">Feedback</button>
        <button type="button" role="tab" data-tab="reports" aria-selected="false">Chat reports</button>
        <button type="button" role="tab" data-tab="chat" aria-selected="false">Chat</button>
      </div>
      <label class="tgl"><input type="checkbox" id="showdone"><span class="sw" aria-hidden="true"></span><span class="tl">Show handled</span></label>
    </div>
    <div class="row" id="chatrow" hidden><label class="field"><span>World id</span><span class="inline"><input id="world" value="public"><button class="btn" id="loadchat" type="button">Load</button></span></label></div>
    <p class="formmsg" id="msg" role="alert"></p>
    <div id="list"></div>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
